server {
    listen 80;
    server_name localhost;
    charset utf-8;
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # 1. Identity Engine Routing Layer
    location /api/v1/idp {
        alias /var/www/html/idp/public;
        try_files $uri $uri/ @idp_backend;

        location ~ \.php$ {
            fastcgi_pass idp:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # 2. Core Administration Modules Router
    location /api/v1/core {
        alias /var/www/html/core/public;
        try_files $uri $uri/ @core_backend;

        location ~ \.php$ {
            fastcgi_pass core:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # 3. Heavy Business Logic Router (CRM, Ecommerce, Drive)
    location /api/v1/business {
        alias /var/www/html/business/public;
        try_files $uri $uri/ @business_backend;

        location ~ \.php$ {
            fastcgi_pass business:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Fallback Named Locations — proxy clean URLs straight to Laravel's front
    # controller, with the /api/v1/<app> prefix STRIPPED so each Laravel app
    # sees its own native route (e.g. "/api/health", "/up"), not the gateway
    # prefix. Three things are required for this to work, all previously
    # missing/broken here:
    #   1. `break` on the rewrite — without it nginx re-searches locations for
    #      the rewritten URI, lands on the implicit default "/" location, and
    #      tries to serve it as a static file under nginx's own default root
    #      (seen as `open() "/etc/nginx/html/index.php" failed` in the error
    #      log).
    #   2. SCRIPT_FILENAME + fastcgi_params — NOT inherited from the sibling
    #      alias-based location above; each named location needs its own.
    #   3. REQUEST_URI/SCRIPT_NAME overridden AFTER `include fastcgi_params`
    #      (which sets REQUEST_URI from the original, unstripped
    #      $request_uri) — otherwise Laravel's router sees the full
    #      "/api/v1/idp/api/health" path, which never matches any route the
    #      app defines, and every request 404s regardless of what routes
    #      exist. $1 is the capture group from the rewrite regex just above.
    location @idp_backend {
        rewrite ^/api/v1/idp/(.*)$ /index.php break;
        fastcgi_pass idp:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /$1$is_args$args;
    }

    location @core_backend {
        rewrite ^/api/v1/core/(.*)$ /index.php break;
        fastcgi_pass core:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /$1$is_args$args;
    }

    location @business_backend {
        rewrite ^/api/v1/business/(.*)$ /index.php break;
        fastcgi_pass business:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /$1$is_args$args;
    }
}
