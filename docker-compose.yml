networks:
  monorepo:
    driver: bridge

volumes:
  mysql_shared_data:
  redis_data:

services:
  # ─────────────────────────────────────────────
  # REDIS (Shared In-Memory Store)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monorepo

  # ─────────────────────────────────────────────
  # FRONTENDS — website & workspace first, then identity/admin,
  # business apps, comms, misc (Ports: 3000-3013)
  # ─────────────────────────────────────────────
  # ── Public site — entry point ──
  website:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP: website
    image: proofofwork/website:latest
    container_name: website
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - monorepo

  # ── Core app — entry point ──
  workspace:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP: workspace
    image: proofofwork/workspace:latest
    container_name: workspace
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - monorepo

  # ── Identity/admin ──
  account:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP: account
    image: proofofwork/account:latest
    container_name: account
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - NEXT_PUBLIC_API_URL_IDP=http://localhost:8000/api/v1/idp
      - NEXT_PUBLIC_API_URL_CORE=http://localhost:8000/api/v1/core
      - NEXT_PUBLIC_API_URL_BUSINESS=http://localhost:8000/api/v1/business
    networks:
      - monorepo

  admin:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP: admin
    image: proofofwork/admin:latest
    container_name: admin
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - NEXT_PUBLIC_API_URL_IDP=http://localhost:8000/api/v1/idp
      - NEXT_PUBLIC_API_URL_CORE=http://localhost:8000/api/v1/core
      - NEXT_PUBLIC_API_URL_BUSINESS=http://localhost:8000/api/v1/business
    networks:
      - monorepo

  superadmin:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP: superadmin
    image: proofofwork/superadmin:latest
    container_name: superadmin
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
    networks:
      - monorepo

  # ── Business apps ──
  crm:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP: crm
    image: proofofwork/crm:latest
    container_name: crm
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
    networks:
      - monorepo

  finance:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP: finance
    image: proofofwork/finance:latest
    container_name: finance
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
    networks:
      - monorepo

  ecommerce:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP: ecommerce
    image: proofofwork/ecommerce:latest
    container_name: ecommerce
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=production
      - PORT=3007
    networks:
      - monorepo

  drive:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP: drive
    image: proofofwork/drive:latest
    container_name: drive
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=production
      - PORT=3008
    networks:
      - monorepo

  approval:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP: approval
    image: proofofwork/approval:latest
    container_name: approval
    restart: unless-stopped
    ports:
      - "3009:3009"
    environment:
      - NODE_ENV=production
      - PORT=3009
    networks:
      - monorepo

  # ── Comms ──
  mail:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP: mail
    image: proofofwork/mail:latest
    container_name: mail
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
    networks:
      - monorepo

  chats:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP: chats
    image: proofofwork/chats:latest
    container_name: chats
    restart: unless-stopped
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=production
      - PORT=3011
    networks:
      - monorepo

  notification:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP: notification
    image: proofofwork/notification:latest
    container_name: notification
    restart: unless-stopped
    ports:
      - "3012:3012"
    environment:
      - NODE_ENV=production
      - PORT=3012
    networks:
      - monorepo

  # ── Misc ──
  ai:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP: ai
    image: proofofwork/ai:latest
    container_name: ai
    restart: unless-stopped
    ports:
      - "3013:3013"
    environment:
      - NODE_ENV=production
      - PORT=3013
    networks:
      - monorepo


  # ─────────────────────────────────────────────
  # BACKENDS (PHP-FPM)
  # ─────────────────────────────────────────────
  idp:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP: idp
    image: proofofwork/idp:latest
    container_name: idp
    restart: unless-stopped
    volumes:
      - ./apps/backend/idp/storage:/var/www/html/storage
      - ./apps/backend/idp/bootstrap/cache:/var/www/html/bootstrap/cache
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_NAME=Idp
      - APP_ENV=local
      - APP_KEY=base64:4F/PSpHvRtTBYxfv43Bg5cbrXqfEEZU5ho0j0xxnyoY=
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000/api/v1/idp
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
      - DB_CONNECTION=mysql
      - DB_HOST=mysql-shared
      - DB_PORT=3306
      - DB_DATABASE=idp_db
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
      - REDIS_CLIENT=predis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - SESSION_LIFETIME=120
      - QUEUE_CONNECTION=redis
    depends_on:
      mysql-shared:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - monorepo

  core:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP: core
    image: proofofwork/core:latest
    container_name: core
    restart: unless-stopped
    volumes:
      - ./apps/backend/core/storage:/var/www/html/storage
      - ./apps/backend/core/bootstrap/cache:/var/www/html/bootstrap/cache
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_NAME=Core
      - APP_ENV=local
      - APP_KEY=base64:yDMM32N7ZhSUoXUdY3KFmQKutczBiVBusQSB2wdirPM=
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000/api/v1/core
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
      - DB_CONNECTION=mysql
      - DB_HOST=mysql-shared
      - DB_PORT=3306
      - DB_DATABASE=core_db
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
      - REDIS_CLIENT=predis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - SESSION_LIFETIME=120
      - QUEUE_CONNECTION=redis
    depends_on:
      mysql-shared:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - monorepo

  business:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP: business
    image: proofofwork/business:latest
    container_name: business
    restart: unless-stopped
    volumes:
      - ./apps/backend/business/storage:/var/www/html/storage
      - ./apps/backend/business/bootstrap/cache:/var/www/html/bootstrap/cache
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_NAME=Business
      - APP_ENV=local
      - APP_KEY=base64:4t5ZjLMJjz1YvNK/dnbu4X39/iqj6jhYT+ozp0IDvrs=
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000/api/v1/business
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
      - DB_CONNECTION=mysql
      - DB_HOST=mysql-shared
      - DB_PORT=3306
      - DB_DATABASE=business_db
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
      - REDIS_CLIENT=predis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - SESSION_LIFETIME=120
      - QUEUE_CONNECTION=redis
    depends_on:
      mysql-shared:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - monorepo

  # ─────────────────────────────────────────────
  # UNIFIED NGINX ROUTING GATEWAY (Replaces 3 separate proxies)
  # ─────────────────────────────────────────────
  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: nginx-gateway
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./apps/backend/idp/public:/var/www/html/idp/public:ro
      - ./apps/backend/core/public:/var/www/html/core/public:ro
      - ./apps/backend/business/public:/var/www/html/business/public:ro
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - idp
      - core
      - business
    networks:
      - monorepo

  # ─────────────────────────────────────────────
  # ONE SINGLE SHARED MYSQL ENGINE (Hosts all 3 DBs)
  # ─────────────────────────────────────────────
  mysql-shared:
    image: mysql:8.4
    container_name: mysql-shared
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_shared_data:/var/lib/mysql
      - ./docker/mysql/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - monorepo